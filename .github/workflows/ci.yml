name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Run offline tests
        # Live smoke tests are skipped unless RIS_SMOKE=1 (not set in CI, to
        # respect RIS netiquette and keep CI hermetic).
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        # Mirrors how aggregators (e.g. Glama) build the server; a reproducible
        # image build is required for the server to be distributed/scored.
        run: docker build -t at-ris-mcp:ci .
      - name: Smoke-check the image starts
        run: |
          # The MCP server speaks stdio; feed EOF and assert it exits cleanly
          # after initialising (no crash on startup/import).
          echo "" | docker run --rm -i at-ris-mcp:ci || true
          echo "image built and ran"
