name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry using GitHub Actions OIDC.
# Because the job runs inside the paragraflabs/at-ris-mcp repository, the
# registry can derive ownership of the io.github.paragraflabs namespace from the
# OIDC token (this avoids the interactive device-flow org-namespace issue).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Sync server.json version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VERSION" <<'PY'
          import json, sys
          v = sys.argv[1]
          data = json.load(open("server.json"))
          data["version"] = v
          for pkg in data.get("packages", []):
              pkg["version"] = v
          json.dump(data, open("server.json", "w"), indent=2)
          open("server.json", "a").write("\n")
          print(f"server.json set to version {v}")
          PY

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
