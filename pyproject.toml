[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "at-ris-mcp"
version = "0.1.0"
description = "Generic MCP server and standalone client library for the Austrian legal information system (RIS)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "at-ris-mcp contributors" }]
keywords = ["ris", "austria", "law", "legal", "mcp", "bundesrecht", "judikatur"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
at-ris-mcp = "ris_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/anomalyco/at-ris-mcp"
Source = "https://github.com/anomalyco/at-ris-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ris_client", "src/ris_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["smoke: live tests hitting the real RIS API (skipped unless RIS_SMOKE=1)"]
