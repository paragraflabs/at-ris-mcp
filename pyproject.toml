[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "at-ris-mcp"
version = "1.0.1"
description = "Generic MCP server and standalone client library for the Austrian legal information system (RIS)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "at-ris-mcp contributors" }]
keywords = ["ris", "austria", "law", "legal", "mcp", "bundesrecht", "landesrecht", "judikatur", "eli", "ecli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: German",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "build>=1.0"]

[project.scripts]
at-ris-mcp = "ris_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/paragraflabs/at-ris-mcp"
Source = "https://github.com/paragraflabs/at-ris-mcp"
Issues = "https://github.com/paragraflabs/at-ris-mcp/issues"
Changelog = "https://github.com/paragraflabs/at-ris-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ris_client", "src/ris_mcp"]

[tool.hatch.build.targets.sdist]
# Deliberately excludes PLAN.md (internal implementation plan / business
# context) and the test-only fixtures/ + reference/ directories, so the public
# sdist ships only the library, its tests and the standard project docs.
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["smoke: live tests hitting the real RIS API (skipped unless RIS_SMOKE=1)"]
